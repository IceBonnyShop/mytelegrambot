<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIP | IceBonny Shop</title>

<style>

body{

    background:#071b1d;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    margin:0;

    font-family:Arial,sans-serif;

    color:white;

}

.box{

    max-width:700px;

    width:90%;

    text-align:center;

    background:#10363a;

    border-radius:20px;

}

h1{

    color:#ffd700;

}

.subtitle{

    margin-bottom:30px;

}

.features{

    margin-bottom:30px;

    line-height:2;

    font-size:18px;

}

.price{

    font-size:38px;

    color:#ffd700;

    font-weight:bold;

    margin-bottom:25px;

}

button{

    background:#ffd700;

    color:black;

    border:none;

    padding:15px 35px;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.05);

}

#message{

    margin-top:25px;

    color:#9be7d8;

    font-size:18px;

</style>

</head>

⭐ 200 Stars

</div>

⭐ Купить за 200 Stars

</button>

</div>

<script>

function buyVip(){

document.getElementById("message").innerHTML=
"🚧 Оплата через Telegram Stars пока недоступна.<br><br>Мы уже работаем над подключением VIP 👑";

</body>
</html>
